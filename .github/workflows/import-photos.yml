name: Importar fotos do Stitch

# Baixa as fotos originais listadas em assets/photos/sources.json (URLs do Stitch)
# e faz commit delas em assets/photos/. Fotos que já existem não são baixadas de novo.
on:
  push:
    paths:
      - assets/photos/sources.json
      - .github/workflows/import-photos.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar fotos
        working-directory: assets/photos
        run: |
          set -euo pipefail
          for name in $(jq -r 'keys[]' sources.json); do
            if compgen -G "$name.*" > /dev/null; then echo "já existe: $name"; continue; fi
            url=$(jq -r --arg n "$name" '.[$n]' sources.json)
            curl -fsSL --retry 3 -o "$name.tmp" "$url=s0" || curl -fsSL --retry 3 -o "$name.tmp" "$url"
            case "$(file -b --mime-type "$name.tmp")" in
              image/jpeg) ext=jpg ;;
              image/png) ext=png ;;
              image/webp) ext=webp ;;
              image/avif) ext=avif ;;
              *) echo "Tipo inesperado para $name:"; file "$name.tmp"; exit 1 ;;
            esac
            mv "$name.tmp" "$name.$ext"
            echo "$name.$ext — $(stat -c%s "$name.$ext") bytes — $(file -b "$name.$ext")"
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "chore: importa fotos originais do Stitch"
          git push
